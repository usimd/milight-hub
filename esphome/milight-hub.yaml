esphome:
  name: milight-hub
  friendly_name: MiLight Hub
  platformio_options:
    build_flags:
      - "-D USE_ESP32_ALTERNATE_SPI"
      - "-D ALT_SPI_MISO_PIN=1"
      - "-D ALT_SPI_MOSI_PIN=2"
      - "-D ALT_SPI_SCLK_PIN=3"
      - "-D ALT_SPI_SS_PIN=19"
      - "-DARDUINO_USB_CDC_ON_BOOT=0"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/usimd/esphome_components
      ref: fut022
    components: [mi]

logger:
  level: DEBUG
  baud_rate: 0  # Disable HW UART — GPIO18/19 used for CE/CSN

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  output_power: 15dB
  ap:
    ssid: "MiLight Hub Fallback"
    password: !secret ap_password
    ap_timeout: 30s

captive_portal:

# --- nRF24L01+ radio ---
# CE=GPIO18, CSN=GPIO19, SCK=GPIO3, MOSI=GPIO2, MISO=GPIO1
mi:
  ce_pin: 18
  csn_pin: 19
  packet_repeats: 50
  listen_repeats: 20
  state_flush_interval: 5000
  rf24_power_level: MAX
  rf24_listen_channel: LOW
  rf24_channels:
    - LOW
    - MID
    - HIGH
  packet_repeats_per_loop: 10
  resend_last_command: true
  on_command_received:
    - homeassistant.event:
        event: esphome.milight_command_received
        data:
          device_id: !lambda "return format_hex(data.device_id);"
          group_id: !lambda "return data.group_id;"
          remote_type: !lambda "return data.remote_type.c_str();"
          command: !lambda "return data.command.c_str();"

# --- Living Room CCT strip ---
# FUT022 remote (device_id 0x0705) paired to MiBoxer CCT controller.
# Hub impersonates the remote — no separate pairing needed.
light:
  - platform: mi
    id: light_living_room
    name: "Living Room"
    mi_device_id: 0x0705
    group_id: 0
    remote_type: fut022
    cold_white_color_temperature: 153 mireds   # 6500K
    warm_white_color_temperature: 370 mireds   # 2700K
    default_transition_length: 0s
    gamma_correct: 1.0

button:
  - platform: restart
    name: "Restart"
